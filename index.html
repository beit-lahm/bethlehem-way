      { track: 'marketing', trackAr: 'ماركيتنج', title: 'عرض القيمة الفريد (Value Proposition)', explain: 'هو الجملة التي تقنع الزائر في أول 5 ثوانٍ بالبقاء. الصيغة العملية: «نساعد [الجمهور] على تحقيق [النتيجة الملموسة] بدون [أكبر عائق يزعجهم]».', drill: 'اكتب عرض قيمة احترافي لمهارتك أو مشروعك باستخدام الصيغة السابقة.', ytTitle: 'خارطة طريق التسويق الرقمي', ytUrl: 'https://www.youtube.com/watch?v=GFifm_fvkRk' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'قمع التسويق (TOFU – MOFU – BOFU)', explain: 'العميل يمر بـ 3 مراحل: الوعي (TOFU: يتعرف على المشكلة)، الاهتمام (MOFU: يقارن الحلول ويثق بك)، ثم القرار (BOFU: عرض مباشر، ضمان، ودعوة للشراء).', drill: 'اقترح فكرة بوست لمرحلة الوعي وفكرة أخرى لمرحلة اتخاذ القرار.', ytTitle: 'كورس التسويق الإلكتروني للمبتدئين', ytUrl: 'https://www.youtube.com/watch?v=STbhc0Rvzao' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'كتابة الإعلان المقنع (Copywriting – AIDA)', explain: 'A: جذب الانتباه بسؤال أو رقم صادم، I: إثارة الاهتمام بشرح الفائدة، D: خلق الرغبة بإثبات اجتماعي، A: دعوة واضحة لاتخاذ إجراء (CTA) مثل «ابعت رسالة الآن».', drill: 'اكتب بوست قصير من 4 أسطر بنموذج AIDA للترويج لورشة مجانية.', ytTitle: 'صناعة المحتوى وكتابة الإعلان', ytUrl: 'https://www.youtube.com/watch?v=6PMFfbxq8nc' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'أسلوب PAS لحل مشاكل العملاء', explain: 'ابدأ بالمشكلة (Problem)، ثم وضّح تكلفة تجاهلها (Agitate)، ثم قدم منتجك كحل مباشر وسهل (Solution). هذا الأسلوب من الأعلى تحويلًا في إعلانات السوشيال.', drill: 'حوّل ميزة تقنية في أي منتج إلى فائدة مقنعة بأسلوب PAS.', ytTitle: 'أسرار كتابة المحتوى التسويقي', ytUrl: 'https://www.youtube.com/watch?v=6PMFfbxq8nc' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'أعمدة المحتوى (Content Pillars)', explain: 'لا تجعل كل منشوراتك «اشتري الآن». قسّم محتواك إلى 4 أعمدة: 40% تعليمي يفيد العميل، 25% قصص ونتائج، 20% تفاعلي/كواليس، 15% عرض بيعي مباشر.', drill: 'حدد 4 أعمدة محتوى لحساب عملي على LinkedIn أو Instagram.', ytTitle: 'كورس السوشيال ميديا والتسويق', ytUrl: 'https://www.youtube.com/watch?v=GFifm_fvkRk' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'خوارزميات السوشيال ميديا وأول 3 ثوانٍ', explain: 'الخوارزميات تقيس وقت المشاهدة (Watch Time) ومعدل الحفظ والمشاركة (Saves & Shares). الجملة الافتتاحية (Hook) هي 80% من نجاح أي ريلز أو بوست.', drill: 'اكتب 3 جمل افتتاحية (Hooks) مختلفة لنفس الموضوع.', ytTitle: 'تعلم التسويق من الصفر لأول عميل', ytUrl: 'https://www.youtube.com/watch?v=NW-jSYB8WtU' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'الإعلانات الممولة (Meta & Google Ads)', explain: 'إعلانات Google تلتقط عميلًا يبحث عنك الآن (نية شراء عالية)، بينما إعلانات Meta/Instagram تخلق اهتمامًا جديدًا وتبني وعيًا بالمنتج عبر استهداف الاهتمامات.', drill: 'حدد متى تختار حملة رسائل ومتى تختار حملة تحويلات موقع.', ytTitle: 'الإعلانات الممولة خطوة بخطوة', ytUrl: 'https://www.youtube.com/watch?v=6PMFfbxq8nc' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'مؤشرات الأداء الأساسية (CTR, CPL, ROAS)', explain: 'CTR = نسبة النقر على الإعلان، CPL = تكلفة العميل المحتمل الواحد، ROAS = العائد على الإنفاق الإعلاني (المبيعات ÷ مصروف الإعلان). الأرقام تمنعك من خسارة الميزانية.', drill: 'احسب ROAS لحملة صرفت 2,000 جنيه وحققت مبيعات 10,000 جنيه (الإجابة: 5x).', ytTitle: 'مقدمة في التسويق الرقمي', ytUrl: 'https://www.youtube.com/watch?v=sbJUSPLzhQo' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'صفحات الهبوط وتحسين التحويل (CRO)', explain: 'الصفحة الناجحة تحتوي على: عنوان واضح، 3 فوائد سريعة، آراء عملاء حقيقيين، إجابة للاعتراضات، وزر إجراء واحد بلون مميز دون تشتيت.', drill: 'افتح أي صفحة منتج وحدد نقطتي قوة ونقطة تحسين واحدة.', ytTitle: 'كورس التسويق الإلكتروني 2024', ytUrl: 'https://www.youtube.com/watch?v=STbhc0Rvzao' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'بناء العلامة الشخصية (Personal Branding)', explain: 'كشاب أو خريج، حسابك على LinkedIn هو واجهتك العملية. شارك ما تتعلمه أسبوعيًا، وثّق مشاريعك الصغيرة، وتفاعل بتعليقات ذكية في مجالك.', drill: 'حدّث عنوانك التعريفي (Headline) على LinkedIn ليعكس القيمة التي تقدمها.', ytTitle: 'إزاي تتعلم تسويق صح لأول عميل', ytUrl: 'https://www.youtube.com/watch?v=NW-jSYB8WtU' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'مشروع ختام الماركيتنج: خطة صفحة واحدة', explain: 'اجمع كل ما تعلمته في ورقة واحدة: من هو العميل؟ ما عرض القيمة؟ ما قناتان أساسيتان للوصول إليه؟ وما أهم 3 مؤشرات ستقيس بها النجاح شهريًا؟', drill: 'اكتب خطة تسويق من 5 نقاط لمشروعك أو خدمتك.', ytTitle: 'تعلم التسويق الإلكتروني في ساعة', ytUrl: 'https://www.youtube.com/watch?v=4ricNvHHL5o' },

      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'قاعدة البرومبت الاحترافي (Role-Context-Task-Format)', explain: 'لبناء أمر قوي حدد 4 عناصر: 1) الدور (أنت خبير...)، 2) السياق (أنا أعمل في...)، 3) المهمة المحددة، 4) شكل المخرج (جدول، 5 نقاط، إيميل رسمي).', drill: 'اكتب برومبت من 4 أجزاء لتنظيم جدول أسبوعك العملي والروحي.', ytTitle: 'أساسيات هندسة أوامر الذكاء الاصطناعي – وليد طه', ytUrl: 'https://www.youtube.com/watch?v=2_3WuekEg4s' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'التوجيه بالأمثلة (Few-Shot Prompting)', explain: 'بدل شرح الأسلوب طويلًا، أعطِ النموذج مثالين من كتابتك السابقة واطلب منه إنتاج النص الجديد بنفس النبرة والطول والتنسيق.', drill: 'أعطِ الـ AI فقرة من كتابتك واطلب منه صياغة إيميل جديد بنفس الأسلوب.', ytTitle: 'كورس Prompt Engineering في أقل من 30 دقيقة', ytUrl: 'https://www.youtube.com/watch?v=1Grt4-ln-1Q' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'التفكير خطوة بخطوة (Chain-of-Thought)', explain: 'إضافة عبارة «فكّر خطوة بخطوة واشرح المعايير قبل القرار النهائي» ترفع دقة التحليل المنطقي والقرارات العملية بشكل كبير.', drill: 'استخدمه للمقارنة بين خيارين عمليين بناءً على 4 معايير.', ytTitle: 'تعلم مهارة كتابة الأوامر للذكاء الاصطناعي', ytUrl: 'https://www.youtube.com/watch?v=Q1Sh00SGdvI' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'تلخيص المستندات والاجتماعات بذكاء', explain: 'اطلب منه دائمًا تقسيم الملخص إلى: (أهم 3 قرارات + قائمة المهام Action Items + المسؤول والموعد النهائي) بدل فقرة طويلة مملة.', drill: 'لخّص مقالًا أو محضر اجتماع طويل في 5 نقاط تنفيذية.', ytTitle: 'هندسة الأوامر لمضاعفة إنتاجيتك', ytUrl: 'https://www.youtube.com/watch?v=HNVJHTeLIjg' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'صياغة وتحسين الإيميلات العملية بالـ AI', explain: 'يمكنك كتابة أفكارك بالعامية وطلب تحويلها لإيميل رسمي أو ودي بالعربية أو الإنجليزية مع خيارين: مختصر وتفصيلي.', drill: 'حوّل 3 ملاحظات سريعة إلى إيميل متابعة منظم.', ytTitle: 'كتابة البرومبت لزيادة الإنتاجية', ytUrl: 'https://www.youtube.com/watch?v=SEwkCSWUoD8' },

      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'هيكلة العروض التقديمية والـ Slides', explain: 'اطلب منه أولًا «هيكل شرائح (Outline) بعناوين قوية و3 نقاط مختصرة لكل شريحة + اقتراح رسم بياني» قبل فتح PowerPoint.', drill: 'اطلب هيكل عرض من 6 شرائح يشرح مشروعًا أو إنجازًا لك.', ytTitle: 'هندسة الأوامر للنتائج الاحترافية', ytUrl: 'https://www.youtube.com/watch?v=HNVJHTeLIjg' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'التحقق من الهلوسة (Fact-Checking)', explain: 'نماذج الـ AI قد تؤلّف أرقامًا أو مراجع تبدو مقنعة لكنها غير صحيحة. القاعدة العملية: استعن به في الصياغة والتنظيم، وتحقق دائمًا من المصادر الرسمية.', drill: 'راجع معلومة أو رقمًا من الـ AI وتأكد من مصدره الأصلي.', ytTitle: 'تحسين البرومبت بالتكرار Iteration', ytUrl: 'https://www.youtube.com/watch?v=YHAxLelTr0k' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'توليد أفكار التسويق والمحتوى بالـ AI', explain: 'اربط ما تعلمته في كورس الماركيتنج بالـ AI: أعطه الـ Persona واطلب 5 Hooks وإعلانات بنموذج AIDA وPAS للاختبار.', drill: 'اطلب 5 أفكار محتوى لجمهور محدد مع CTA مناسب لكل فكرة.', ytTitle: 'أساسيات هندسة الأوامر – وليد طه', ytUrl: 'https://www.youtube.com/watch?v=2_3WuekEg4s' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'أتمتة المهام المتكررة (Apps Script & No-Code)', explain: 'حتى بدون خبرة برمجية عميقة، يمكنك وصف مهمة متكررة في Google Sheets ليولّد لك كود Apps Script يختصر ساعات أسبوعيًا.', drill: 'حدد مهمة متكررة في يومك واسأل الـ AI كيف تختصر وقتها للنصف.', ytTitle: 'كورس Prompt Engineering في أقل من 30 دقيقة', ytUrl: 'https://www.youtube.com/watch?v=1Grt4-ln-1Q' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'الـ AI كمدرب شخصي ومحاكاة مقابلات العمل', explain: 'اطلب منه تقمّص دور مدير توظيف يسألك سؤالًا تلو الآخر ثم يقيّم إجابتك ويقترح نسخة أقوى.', drill: 'أجرِ مقابلة تجريبية من 3 أسئلة واطلب تقييمًا لنقاط التحسين.', ytTitle: 'كتابة البرومبت لزيادة الإنتاجية', ytUrl: 'https://www.youtube.com/watch?v=SEwkCSWUoD8' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'الخصوصية وأمان البيانات مع أدوات الـ AI', explain: 'لا تضع أبدًا كلمات سر، أرقام قومية، بيانات عملاء سرية، أو عقودًا خاصة كما هي؛ استبدل الأسماء والأرقام برموز (Anonymization) أولًا.', drill: 'طبّق قاعدة إخفاء الأسماء الحقيقية قبل تلخيص أي مستند عمل.', ytTitle: 'النماذج الكبرى وهندسة الأوامر', ytUrl: 'https://www.youtube.com/watch?v=cJZGYNFw9RI' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'بناء مكتبة برومبتات خاصة بمجالك', explain: 'بدل إعادة كتابة الأوامر كل يوم، احفظ أفضل 5 برومبتات مجرّبة في ملف واحد على Google Docs أو Keep لاستخدامها في ثوانٍ.', drill: 'اجمع 3 قوالب برومبت جاهزة ستستخدمها الأسبوع القادم.', ytTitle: 'تعلم كتابة البرومبت باحتراف', ytUrl: 'https://www.youtube.com/watch?v=YHAxLelTr0k' },

      // Track 3: Practical Business English (Days 30–43)
      { track: 'english', trackAr: 'لغة إنجليزية', title: 'التعريف العملي بالنفس (Elevator Pitch)', explain: 'صيغة واثقة في 30 ثانية: <span class="ltr-text font-semibold">"Hi, I’m [Name]. I work in [Field], focusing on [Skill]. Currently, I’m building my experience in [Goal]."</span> استخدم جملًا قصيرة وواضحة.', drill: 'سجّل لنفسك صوتًا لمدة 30 ثانية تعرّف فيها نفسك بالإنجليزية بصوت مسموع.', ytTitle: 'أهم الكلمات الإنجليزية للأعمال Business English', ytUrl: 'https://www.youtube.com/watch?v=AQ3D_t_ZzSU' },
      { track: 'english', trackAr: 'لغة إنجليزية', title: 'افتتاحيات وختاميات الإيميل الاحترافي', explain: 'للبداية: <span class="ltr-text font-semibold">"I hope this email finds you well."</span> وللغرض: <span class="ltr-text font-semibold">"I’m reaching out regarding..."</span> وللختام: <span class="ltr-text font-semibold">"Please let me know if you need any further details. Best regards."</span>', drill: 'اكتب إيميلًا من 4 جمل لطلب موعد اجتماع (Meeting Request).', ytTitle: 'تعلم الإنجليزية العملية للعمل', ytUrl: 'https://www.youtube.com/shorts/G-kU2lglNzM' },
      { track: 'english', trackAr: 'لغة إنجليزية', title: 'لغة المتابعة المهذبة (Polite Follow-Up)', explain: 'بدل الإلحاح الجاف، استخدم: <span class="ltr-text font-semibold">"Just following up on my previous email regarding..."</span> أو <span class="ltr-text font-semibold">"I wanted to gently check in on the status of..."</span>', drill: 'اكتب رسالة متابعة مهذبة لإيميل أرسلته منذ 3 أيام.', ytTitle: 'محادثات Business English الرسمية', ytUrl: 'https://www.youtube.com/watch?v=tfl9i3XYurI' },

    const ARABIC_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    function getDateForDay(dayNum) {
      const start = new Date(2026, 10, 25);
      const d = new Date(start.getTime() + (dayNum - 1) * 86400000);
      const dd = d.getDate(), mm = d.getMonth() + 1, yyyy = d.getFullYear();
      return {
        label: `${ARABIC_DAYS[d.getDay()]} ${dd}/${mm}/${yyyy}`,
        short: `${dd}/${mm}`,
        iso: `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`
      };
    }

      } catch (e) {

    const DAILY_KEYS = ['reel', 'prayer', 'teaching', 'career'];

    function getDayCompletion(dayNum) {
      let c = 0;
      DAILY_KEYS.forEach(k => { if (state.completedTasks[`${dayNum}_${k}`]) c++; });
      return c;
    }

    function getStats() {
      let totalDone = 0, spiritualDone = 0, careerDone = 0, fullDays = 0, activeDays = 0;
      let marketingDone = 0, aiDone = 0, englishDone = 0;
      DAYS_DATA.forEach(d => {
        const c = getDayCompletion(d.day);
        totalDone += c;
        if (c === 4) fullDays++;
        if (c > 0) activeDays++;
        ['reel', 'prayer', 'teaching'].forEach(k => { if (state.completedTasks[`${d.day}_${k}`]) spiritualDone++; });
        if (state.completedTasks[`${d.day}_career`]) {
          careerDone++;
          if (d.career.track === 'marketing') marketingDone++;
          if (d.career.track === 'ai') aiDone++;
          if (d.career.track === 'english') englishDone++;
        }
      });

      let quizScore = 0, quizCorrect = 0, quizAnswered = 0;
      COMPETITION_BANK.forEach(q => {
        if (state.quizAnswers[q.id] !== undefined) {
          quizAnswered++;
          if (state.quizAnswers[q.id] === q.ans) {
            quizScore += 10;
            quizCorrect++;
          }
        }
      });

      return {
        totalDone,
        totalPct: Math.round((totalDone / TOTAL_DAILY_TASKS) * 100),
        spiritualPct: Math.round((spiritualDone / (43 * 3)) * 100),
        careerPct: Math.round((careerDone / 43) * 100),
        careerDone, marketingDone, aiDone, englishDone,
        fullDays, activeDays,
        quizScore, quizCorrect, quizAnswered
      };
    }

    // =========================================================================

    function render() {
      document.documentElement.classList.toggle('dark', state.darkMode);
      document.body.classList.remove('font-size-sm', 'font-size-md', 'font-size-lg');
      document.body.classList.add(`font-size-${state.fontSize}`);

      const topHeader = document.getElementById('topHeader');
      const bottomNav = document.getElementById('bottomNav');
      const banner = document.getElementById('announcementBanner');
      const main = document.getElementById('mainContent');

      if (!state.isLoggedIn) {
        topHeader.classList.add('hidden');
        bottomNav.classList.add('hidden');
        banner.classList.add('hidden');
        main.innerHTML = renderLogin();
        lucide.createIcons();
        return;
      }

      topHeader.classList.remove('hidden');
      bottomNav.classList.remove('hidden');
      document.getElementById('darkIcon').setAttribute('data-lucide', state.darkMode ? 'sun' : 'moon');
      document.getElementById('headerMeetingLabel').textContent = `${state.user.meeting} • 43 يومًا`;

      const roleMap = {
        user: { text: 'مستخدم', cls: 'bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-200' },
        admin: { text: 'أدمن خادم', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200' },
        super_admin: { text: 'مدير النظام', cls: 'bg-purple-100 text-purple-800 dark:bg-purple-900/50 dark:text-purple-200' }
      }[state.role];
      const rb = document.getElementById('roleBadge');
      rb.textContent = roleMap.text;
      rb.className = `text-[10px] font-bold px-1.5 py-0.5 rounded-full shrink-0 ${roleMap.cls}`;
      const quickRoleBtn = document.getElementById('btnQuickRole');
      if (quickRoleBtn) quickRoleBtn.classList.toggle('hidden', IS_SUPABASE_CONFIGURED);

      if (state.announcement && state.announcement.trim()) {
        document.getElementById('announcementText').textContent = state.announcement;
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }

      if (state.activeTab === 'home') main.innerHTML = renderHome();
      else if (state.activeTab === 'journey') main.innerHTML = renderJourney();
      else if (state.activeTab === 'courses') main.innerHTML = renderCourses();
      else if (state.activeTab === 'quiz') main.innerHTML = renderQuizAndLeaderboard();
      else if (state.activeTab === 'attendance') main.innerHTML = renderAttendance();
      else if (state.activeTab === 'settings') main.innerHTML = renderSettingsAndProControl();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.classList.toggle('text-nativity-800', active && !state.darkMode);
        btn.classList.toggle('dark:text-nativity-gold', active);
        btn.classList.toggle('bg-teal-50', active && !state.darkMode);
        btn.classList.toggle('dark:bg-slate-800', active);
        btn.classList.toggle('text-slate-500', !active);
      });

      lucide.createIcons();
    }

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'loginForm') {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const meeting = document.getElementById('loginMeeting').value;
        const whatsapp = document.getElementById('loginWhatsapp').value.trim();
        state.user = { email, name: email.split('@')[0], meeting, whatsapp, whatsappOptIn: true };
        state.isLoggedIn = true;
        state.activeTab = 'home';
        saveState();
        render();
        showToast(`أهلًا بيك في رحلة صوم الميلاد – ${meeting} ✝️`);
      }
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest('#btnDemoLogin')) {
        state.user = { email: 'demo@onamission.app', name: 'خادم تجريبي', meeting: 'مارمينا خريجين', whatsapp: '01000000000', whatsappOptIn: true };
        state.isLoggedIn = true;
        state.activeTab = 'home';
        saveState();
        render();
        showToast('تم الدخول التجريبي بنجاح ✓');
        return;
      }
      if (e.target.closest('#btnLogout')) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        liveLeaderboardCache = null;
        liveMeetingStatsCache = null;
        try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
        render();
        return;
      }
      const nav = e.target.closest('[data-tab]');
      if (nav) {
        state.activeTab = nav.dataset.tab;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      if (e.target.closest('#btnSosTop')) { openEmergencyHubModal(); return; }
      if (e.target.closest('#btnDarkToggle')) { state.darkMode = !state.darkMode; saveState(); render(); return; }
      if (e.target.closest('#btnQuickRole')) {
        const order = ['user', 'admin', 'super_admin'];
        state.role = order[(order.indexOf(state.role) + 1) % order.length];
        state.activeTab = 'settings';
        saveState();
        render();
        showToast(`تم التبديل إلى: ${state.role === 'user' ? 'مستخدم' : state.role === 'admin' ? 'أدمن خادم' : 'مدير النظام'}`);
        return;
      }
      if (e.target.closest('#btnCloseModal') || e.target.id === 'modalOverlay') { closeModal(); return; }
      if (e.target.closest('#btnOpenCert') || e.target.closest('#btnJourneyCert')) { openCertificateModal(); return; }
      if (e.target.closest('#btnPrevDay') && state.selectedDay > 1) { state.selectedDay--; saveState(); render(); return; }
      if (e.target.closest('#btnNextDay') && state.selectedDay < 43) {
        if (state.lockFutureDays && state.role === 'user') { showToast('مدير النظام فعّل قفل الأيام المستقبلية'); return; }
        state.selectedDay++; saveState(); render(); return;
      }
      const jump = e.target.closest('[data-jump-day]');
      if (jump && !jump.disabled) { state.selectedDay = Number(jump.dataset.jumpDay); state.activeTab = 'home'; saveState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const tt = e.target.closest('[data-toggle-task]');
      if (tt) {
        const key = `${state.selectedDay}_${tt.dataset.toggleTask}`;
        state.completedTasks[key] = !state.completedTasks[key];
        saveState(); render();
        if (state.completedTasks[key]) showToast('تم تسجيل الإنجاز ✓');
        return;
      }
      if (e.target.closest('#btnPrayerPlus1')) { state.jesusPrayers += 1; saveState(); render(); return; }
      if (e.target.closest('#btnPrayerPlus10')) { state.jesusPrayers += 10; saveState(); render(); showToast('+10 صلوات يسوع 🙏'); return; }
      const cf = e.target.closest('[data-course-filter]');
      if (cf) { state.courseFilter = cf.dataset.courseFilter; saveState(); render(); return; }
      const expL = e.target.closest('[data-expand-lesson]');
      if (expL) { const day = Number(expL.dataset.expandLesson); state.expandedLessonDay = state.expandedLessonDay === day ? null : day; saveState(); render(); return; }
      const tglL = e.target.closest('[data-toggle-lesson-day]');
      if (tglL) { const key = `${tglL.dataset.toggleLessonDay}_career`; state.completedTasks[key] = !state.completedTasks[key]; saveState(); render(); return; }
      const qCat = e.target.closest('[data-q-cat]');
      if (qCat) { state.quizCatFilter = qCat.dataset.qCat; saveState(); render(); return; }
      const compOpt = e.target.closest('[data-comp-q]');
      if (compOpt) {
        const qId = compOpt.dataset.compQ;
        const optIdx = Number(compOpt.dataset.compOpt);
        state.quizAnswers[qId] = optIdx;
        saveState(); render();
        const qObj = COMPETITION_BANK.find(x => x.id === qId);
        showToast(qObj && optIdx === qObj.ans ? 'إجابة صحيحة! +10 نقاط وتحديث الترتيب 🏆' : 'راجع الشرح الأرثوذكسي وجرب السؤال التالي');
        return;
      }
      if (e.target.closest('#btnSubmitEmergency')) {
        const type = document.getElementById('emTypeSelect').value;
        const note = document.getElementById('emNoteInput').value.trim() || 'طلب تواصل سريع';
        state.emergencyRequests.unshift({ id: `REQ-${103 + state.emergencyRequests.length}`, meeting: state.user.meeting, type, note, status: 'جديد' });
        saveState(); closeModal(); showToast('تم إرسال طلبك بسرية للخادم المختص ✓');
        return;
      }
      const fs = e.target.closest('[data-font-size]');
      if (fs) { state.fontSize = fs.dataset.fontSize; saveState(); render(); return; }
      const rb = e.target.closest('[data-set-role]');
      if (rb && !IS_SUPABASE_CONFIGURED) { state.role = rb.dataset.setRole; saveState(); render(); return; }
      const asub = e.target.closest('[data-admin-sub]');
      if (asub) { state.adminSubTab = asub.dataset.adminSub; saveState(); render(); return; }
      if (e.target.closest('#btnPublishAnn')) {
        state.announcement = document.getElementById('adminAnnInput').value.trim();
        state.auditLog.unshift({ time: 'الآن', actor: state.role === 'super_admin' ? 'مدير النظام' : 'أدمن خادم', action: 'تحديث التنبيه العام' });
        saveState(); render(); showToast('تم نشر التنبيه ✓'); return;
      }
      const reqB = e.target.closest('[data-req-id]');
      if (reqB) {
        const r = state.emergencyRequests.find(x => x.id === reqB.dataset.reqId);
        if (r) { r.status = reqB.dataset.reqStatus; state.auditLog.unshift({ time: 'الآن', actor: 'أدمن خادم', action: `تحديث حالة ${r.id} إلى (${r.status})` }); saveState(); render(); showToast(`تم التحديث إلى: ${r.status}`); }
        return;
      }
      const waSim = e.target.closest('[data-wa-sim]');
      if (waSim) {
        const u = state.inactiveDemoUsers.find(x => x.id === waSim.dataset.waSim);
        if (u) {
          u.sent = true;
          state.auditLog.unshift({ time: 'الآن', actor: 'أتمتة واتساب', action: `إرسال تذكير غياب إلى ${u.name} (${u.meeting})` });
          saveState(); render(); showToast(`تمت محاكاة إرسال رسالة واتساب إلى ${u.name} ✓`);
        }
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'attendanceDateInput') { state.attendanceDate = e.target.value; saveState(); render(); return; }
      if (e.target.dataset.attCheck) {
        const d = state.attendanceDate;
        if (!state.attendance[d]) state.attendance[d] = { checks: {}, notes: {} };
        state.attendance[d].checks[e.target.dataset.attCheck] = e.target.checked;
        saveState(); return;
      }
      if (e.target.id === 'reminderTimeInput') { state.reminderTime = e.target.value; saveState(); showToast(`تم ضبط المنبّه على ${state.reminderTime}`); return; }
      if (e.target.id === 'chkUserWaOptIn') { state.user.whatsappOptIn = e.target.checked; saveState(); showToast(e.target.checked ? 'تم تفعيل تذكير واتساب ✓' : 'تم إيقاف تذكير واتساب'); return; }
      if (e.target.id === 'chkQuizOpen') { state.quizOpen = e.target.checked; state.auditLog.unshift({ time: 'الآن', actor: 'الأدمن', action: e.target.checked ? 'فتح المسابقة' : 'إغلاق المسابقة مؤقتًا' }); saveState(); render(); return; }
      if (e.target.id === 'chkLockFuture') { state.lockFutureDays = e.target.checked; state.auditLog.unshift({ time: 'الآن', actor: 'مدير النظام', action: e.target.checked ? 'قفل الأيام المستقبلية' : 'فتح كل الأيام' }); saveState(); render(); return; }
      if (e.target.id === 'waCheckTime') { state.whatsappConfig.checkTime = e.target.value; saveState(); showToast(`تم ضبط فحص الغياب على ${e.target.value}`); return; }
    });

    document.addEventListener('input', (e) => {
      if (e.target.dataset.attNote) {
        const d = state.attendanceDate;
        if (!state.attendance[d]) state.attendance[d] = { checks: {}, notes: {} };
        state.attendance[d].notes[e.target.dataset.attNote] = e.target.value;
        saveState(); return;
      }
      if (e.target.id === 'waTemplateInput') { state.whatsappConfig.template = e.target.value; saveState(); }
    });


    // =========================================================================
    // 9. SUPABASE LIVE SYNC LAYER (Activates automatically once keys are set)
    // =========================================================================
    async function syncFromSupabase(userObj) {
      if (!sb || !userObj) return;
      try {
        const uid = userObj.id;
        const { data: prof } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
        if (prof) {
          state.user = {
            id: uid,
            email: prof.email,
            name: prof.full_name,
            meeting: prof.meeting,
            whatsapp: prof.whatsapp || '',
            whatsappOptIn: !!prof.whatsapp_opt_in
          };
          state.jesusPrayers = prof.jesus_prayers || 0;
          await sb.from('profiles').update({ last_active_date: new Date().toISOString().slice(0, 10) }).eq('id', uid);
        }
        state.role = 'user';
        const { data: roleRow } = await sb.from('user_roles').select('role').eq('user_id', uid).maybeSingle();
        if (roleRow && roleRow.role) {
          state.role = roleRow.role === 'servant_admin' ? 'admin' : roleRow.role;
        }
        const { data: progRows } = await sb.from('user_progress').select('day_num,task_key').eq('user_id', uid);
        if (Array.isArray(progRows)) {
          state.completedTasks = {};
          progRows.forEach(r => { state.completedTasks[`${r.day_num}_${r.task_key}`] = true; });
        }
        const { data: qRows } = await sb.from('quiz_answers').select('question_id,selected_option').eq('user_id', uid);
        if (Array.isArray(qRows)) {
          state.quizAnswers = {};
          qRows.forEach(r => { state.quizAnswers[r.question_id] = r.selected_option; });
        }
        const { data: cfg } = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle();
        if (cfg) {
          state.announcement = cfg.announcement || '';
          state.quizOpen = !!cfg.quiz_open;
          state.lockFutureDays = !!cfg.lock_future_days;
          state.whatsappConfig.checkTime = cfg.wa_check_time || '20:00';
          state.whatsappConfig.template = cfg.wa_template || state.whatsappConfig.template;
        }
        const { data: lb } = await sb.rpc('get_live_leaderboard');
        if (Array.isArray(lb)) liveLeaderboardCache = lb;

        if (state.role === 'admin' || state.role === 'super_admin') {
          const { data: mStats } = await sb.rpc('get_admin_meeting_stats');
          if (Array.isArray(mStats)) liveMeetingStatsCache = mStats;
          const { data: em } = await sb.from('emergency_requests').select('*').order('created_at', { ascending: false }).limit(30);
          if (Array.isArray(em)) {
            state.emergencyRequests = em.map(x => ({ id: String(x.id), meeting: x.meeting, type: x.request_type, note: x.note, status: x.status }));
          }
          const { data: wa } = await sb.rpc('get_inactive_whatsapp_users');
          if (Array.isArray(wa)) {
            state.inactiveDemoUsers = wa.map(u => {
              const digits = String(u.whatsapp || '').replace(/[^0-9]/g, '');
              const egyptPhone = digits.startsWith('0') ? '20' + digits.slice(1) : digits;
              return { id: u.user_id, name: u.full_name, meeting: u.meeting, phone: egyptPhone, lastDate: u.last_active_date, sent: false };
            });
          } else {
            state.inactiveDemoUsers = [];
          }
          const { data: logs } = await sb.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(20);
          if (Array.isArray(logs)) {
            state.auditLog = logs.map(l => ({ time: new Date(l.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }), actor: l.actor_email, action: l.action }));
          }
        } else {
          state.emergencyRequests = [];
          state.inactiveDemoUsers = [];
          liveMeetingStatsCache = null;
        }
        state.isLoggedIn = true;
        saveState();
        render();
      } catch (err) {
        showToast('تم الاتصال جزئيًا — تأكد من تشغيل setup_supabase.sql');
      }
    }

    async function handleSupabaseAuth(mode) {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const meeting = document.getElementById('loginMeeting').value;
      const whatsapp = document.getElementById('loginWhatsapp').value.trim();
      const fullName = (document.getElementById('loginName') && document.getElementById('loginName').value.trim()) || email.split('@')[0];

      if (!email || !password) { showToast('اكتب الإيميل والباسورد أولًا'); return; }

      if (!sb) {
        state.user = { id: 'local_user', email, name: fullName, meeting, whatsapp, whatsappOptIn: true };
        state.isLoggedIn = true;
        state.activeTab = 'home';
        saveState();
        render();
        showToast(`أهلًا بيك في رحلة صوم الميلاد – ${meeting} ✝️`);
        return;
      }

      try {
        let authRes;
        if (mode === 'signup') {
          authRes = await sb.auth.signUp({ email, password });
          if (authRes.error) throw authRes.error;
          if (authRes.data && authRes.data.user) {
            await sb.from('profiles').upsert({
              id: authRes.data.user.id,
              email,
              full_name: fullName,
              meeting,
              whatsapp,
              whatsapp_opt_in: true,
              last_active_date: new Date().toISOString().slice(0, 10)
            });
            showToast('تم إنشاء حسابك بنجاح! 🎉');
            await syncFromSupabase(authRes.data.user);
          }
        } else {
          authRes = await sb.auth.signInWithPassword({ email, password });
          if (authRes.error) throw authRes.error;
          if (authRes.data && authRes.data.user) {
            await sb.from('profiles').upsert({
              id: authRes.data.user.id,
              email,
              full_name: fullName,
              meeting,
              whatsapp,
              last_active_date: new Date().toISOString().slice(0, 10)
            }, { onConflict: 'id' });
            showToast('تم تسجيل الدخول بنجاح ✝️');
            await syncFromSupabase(authRes.data.user);
          }
        }
      } catch (err) {
        showToast(err && err.message ? `خطأ: ${err.message}` : 'تأكد من الإيميل والباسورد');
      }
    }

    // Intercept signup button & live DB writes
    document.addEventListener('click', async (e) => {
      if (e.target.closest('#btnSignUpSubmit')) {
        await handleSupabaseAuth('signup');
        return;
      }
      if (!sb || !state.user.id) return;

      const tt = e.target.closest('[data-toggle-task]');
      if (tt) {
        const key = tt.dataset.toggleTask;
        const done = !!state.completedTasks[`${state.selectedDay}_${key}`];
        if (done) await sb.from('user_progress').upsert({ user_id: state.user.id, day_num: state.selectedDay, task_key: key });
        else await sb.from('user_progress').delete().match({ user_id: state.user.id, day_num: state.selectedDay, task_key: key });
      }
      const compOpt = e.target.closest('[data-comp-q]');
      if (compOpt) {
        const qId = compOpt.dataset.compQ;
        const idx = Number(compOpt.dataset.compOpt);
        const qObj = COMPETITION_BANK.find(x => x.id === qId);
        const ok = !!(qObj && idx === qObj.ans);
        await sb.from('quiz_answers').upsert({ user_id: state.user.id, question_id: qId, selected_option: idx, is_correct: ok, points: ok ? 10 : 0 });
        const { data: lb } = await sb.rpc('get_live_leaderboard');
        if (Array.isArray(lb)) { liveLeaderboardCache = lb; render(); }
      }
      if (e.target.closest('#btnPrayerPlus1') || e.target.closest('#btnPrayerPlus10')) {
        await sb.from('profiles').update({ jesus_prayers: state.jesusPrayers }).eq('id', state.user.id);
      }
      if (e.target.closest('#btnSubmitEmergency')) {
        const latest = state.emergencyRequests[0];
        if (latest) await sb.from('emergency_requests').insert({ user_id: state.user.id, user_name: state.user.name, meeting: state.user.meeting, request_type: latest.type, note: latest.note });
      }
      if (e.target.closest('#btnPublishAnn')) {
        await sb.from('app_settings').update({ announcement: state.announcement, updated_at: new Date().toISOString() }).eq('id', 1);
      }
      const reqB = e.target.closest('[data-req-id]');
      if (reqB) {
        await sb.from('emergency_requests').update({ status: reqB.dataset.reqStatus }).eq('id', Number(reqB.dataset.reqId));
      }
      if (e.target.closest('#btnRefreshAdmin') || e.target.closest('#btnRefreshWa')) {
        const { data } = await sb.auth.getUser();
        if (data && data.user) {
          await syncFromSupabase(data.user);
          showToast('تم تحديث بيانات لوحة التحكم والغياب ✓');
        }
        return;
      }
      if (e.target.closest('#btnLogout')) {
        await sb.auth.signOut();
      }
    });

    document.addEventListener('change', async (e) => {
      if (!sb || !state.user.id) return;
      if (e.target.dataset.attCheck) {
        const d = state.attendanceDate;
        const rec = state.attendance[d] || { checks: {}, notes: {} };
        await sb.from('attendance_logs').upsert({ user_id: state.user.id, log_date: d, checks: rec.checks, notes: rec.notes, updated_at: new Date().toISOString() });
      }
      if (e.target.id === 'chkUserWaOptIn') {
        await sb.from('profiles').update({ whatsapp_opt_in: e.target.checked }).eq('id', state.user.id);
      }
      if (e.target.id === 'chkQuizOpen') {
        await sb.from('app_settings').update({ quiz_open: e.target.checked, updated_at: new Date().toISOString() }).eq('id', 1);
      }
      if (e.target.id === 'chkLockFuture') {
        await sb.from('app_settings').update({ lock_future_days: e.target.checked, updated_at: new Date().toISOString() }).eq('id', 1);
      }
      if (e.target.id === 'waCheckTime') {
        await sb.from('app_settings').update({ wa_check_time: e.target.value, updated_at: new Date().toISOString() }).eq('id', 1);
      }
    });

    // Replace local-only form submit with Supabase-aware handler
    document.addEventListener('submit', async (e) => {
      if (e.target.id === 'loginForm' && sb) {
        e.preventDefault();
        await handleSupabaseAuth('signin');
      }
    }, true);

    if (sb) {
      sb.auth.getSession().then(({ data }) => {
        if (data && data.session && data.session.user) syncFromSupabase(data.session.user);
      });
    }

    render();
  </script>
</body>
</html>
