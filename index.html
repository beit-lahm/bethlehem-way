      { track: 'marketing', trackAr: 'ماركيتنج', title: 'تحديد الجمهور المستهدف (Customer Persona)', explain: 'عندما تحاول بيع منتج للجميع، لا يشتريه أحد. الـ Persona هي بطاقة تخيلية للعميل المثالي تشمل: العمر، الوظيفة، أكثر مشكلة تزعجه، والمنصات التي يتصفحها يوميًا.', drill: 'صمّم Persona لعميل واحد محتمل لمشروع يهمك في 4 نقاط واضحة.', ytTitle: 'كورس التسويق الإلكتروني خطوة بخطوة', ytUrl: 'https://www.youtube.com/watch?v=0fvYICr7m0M' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'نموذج STP: التقسيم والاستهداف والتموضع', explain: 'Segmentation (تقسيم السوق لشرائح)، ثم Targeting (اختيار شريحة واحدة مربحة)، ثم Positioning (تثبيت صورة ذهنية مميزة لك عن المنافسين مثل السعر أو السرعة أو الجودة).', drill: 'اختر علامة تجارية مصرية واكتب في جملة واحدة كيف تميز نفسها.', ytTitle: 'تعلم التسويق الإلكتروني من الصفر في ساعة', ytUrl: 'https://www.youtube.com/watch?v=4ricNvHHL5o' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'عرض القيمة الفريد (Value Proposition)', explain: 'هو الجملة التي تقنع الزائر في أول 5 ثوانٍ بالبقاء. الصيغة العملية: «نساعد [الجمهور] على تحقيق [النتيجة الملموسة] بدون [أكبر عائق يزعجهم]».', drill: 'اكتب عرض قيمة احترافي لمهارتك أو مشروعك باستخدام الصيغة السابقة.', ytTitle: 'خارطة طريق التسويق الرقمي', ytUrl: 'https://www.youtube.com/watch?v=GFifm_fvkRk' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'قمع التسويق (TOFU – MOFU – BOFU)', explain: 'العميل يمر بـ 3 مراحل: الوعي (TOFU: يتعرف على المشكلة)، الاهتمام (MOFU: يقارن الحلول ويثق بك)، ثم القرار (BOFU: عرض مباشر، ضمان، ودعوة للشراء).', drill: 'اقترح فكرة بوست لمرحلة الوعي وفكرة أخرى لمرحلة اتخاذ القرار.', ytTitle: 'كورس التسويق الإلكتروني للمبتدئين', ytUrl: 'https://www.youtube.com/watch?v=STbhc0Rvzao' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'كتابة الإعلان المقنع (Copywriting – AIDA)', explain: 'A: جذب الانتباه بسؤال أو رقم صادم، I: إثارة الاهتمام بشرح الفائدة، D: خلق الرغبة بإثبات اجتماعي، A: دعوة واضحة لاتخاذ إجراء (CTA) مثل «ابعت رسالة الآن».', drill: 'اكتب بوست قصير من 4 أسطر بنموذج AIDA للترويج لورشة مجانية.', ytTitle: 'صناعة المحتوى وكتابة الإعلان', ytUrl: 'https://www.youtube.com/watch?v=6PMFfbxq8nc' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'أسلوب PAS لحل مشاكل العملاء', explain: 'ابدأ بالمشكلة (Problem)، ثم وضّح تكلفة تجاهلها (Agitate)، ثم قدم منتجك كحل مباشر وسهل (Solution). هذا الأسلوب من الأعلى تحويلًا في إعلانات السوشيال.', drill: 'حوّل ميزة تقنية في أي منتج إلى فائدة مقنعة بأسلوب PAS.', ytTitle: 'أسرار كتابة المحتوى التسويقي', ytUrl: 'https://www.youtube.com/watch?v=6PMFfbxq8nc' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'أعمدة المحتوى (Content Pillars)', explain: 'لا تجعل كل منشوراتك «اشتري الآن». قسّم محتواك إلى 4 أعمدة: 40% تعليمي يفيد العميل، 25% قصص ونتائج، 20% تفاعلي/كواليس، 15% عرض بيعي مباشر.', drill: 'حدد 4 أعمدة محتوى لحساب عملي على LinkedIn أو Instagram.', ytTitle: 'كورس السوشيال ميديا والتسويق', ytUrl: 'https://www.youtube.com/watch?v=GFifm_fvkRk' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'خوارزميات السوشيال ميديا وأول 3 ثوانٍ', explain: 'الخوارزميات تقيس وقت المشاهدة (Watch Time) ومعدل الحفظ والمشاركة (Saves & Shares). الجملة الافتتاحية (Hook) هي 80% من نجاح أي ريلز أو بوست.', drill: 'اكتب 3 جمل افتتاحية (Hooks) مختلفة لنفس الموضوع.', ytTitle: 'تعلم التسويق من الصفر لأول عميل', ytUrl: 'https://www.youtube.com/watch?v=NW-jSYB8WtU' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'الإعلانات الممولة (Meta & Google Ads)', explain: 'إعلانات Google تلتقط عميلًا يبحث عنك الآن (نية شراء عالية)، بينما إعلانات Meta/Instagram تخلق اهتمامًا جديدًا وتبني وعيًا بالمنتج عبر استهداف الاهتمامات.', drill: 'حدد متى تختار حملة رسائل ومتى تختار حملة تحويلات موقع.', ytTitle: 'الإعلانات الممولة خطوة بخطوة', ytUrl: 'https://www.youtube.com/watch?v=6PMFfbxq8nc' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'مؤشرات الأداء الأساسية (CTR, CPL, ROAS)', explain: 'CTR = نسبة النقر على الإعلان، CPL = تكلفة العميل المحتمل الواحد، ROAS = العائد على الإنفاق الإعلاني (المبيعات ÷ مصروف الإعلان). الأرقام تمنعك من خسارة الميزانية.', drill: 'احسب ROAS لحملة صرفت 2,000 جنيه وحققت مبيعات 10,000 جنيه (الإجابة: 5x).', ytTitle: 'مقدمة في التسويق الرقمي', ytUrl: 'https://www.youtube.com/watch?v=sbJUSPLzhQo' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'صفحات الهبوط وتحسين التحويل (CRO)', explain: 'الصفحة الناجحة تحتوي على: عنوان واضح، 3 فوائد سريعة، آراء عملاء حقيقيين، إجابة للاعتراضات، وزر إجراء واحد بلون مميز دون تشتيت.', drill: 'افتح أي صفحة منتج وحدد نقطتي قوة ونقطة تحسين واحدة.', ytTitle: 'كورس التسويق الإلكتروني 2024', ytUrl: 'https://www.youtube.com/watch?v=STbhc0Rvzao' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'بناء العلامة الشخصية (Personal Branding)', explain: 'كشاب أو خريج، حسابك على LinkedIn هو واجهتك العملية. شارك ما تتعلمه أسبوعيًا، وثّق مشاريعك الصغيرة، وتفاعل بتعليقات ذكية في مجالك.', drill: 'حدّث عنوانك التعريفي (Headline) على LinkedIn ليعكس القيمة التي تقدمها.', ytTitle: 'إزاي تتعلم تسويق صح لأول عميل', ytUrl: 'https://www.youtube.com/watch?v=NW-jSYB8WtU' },
      { track: 'marketing', trackAr: 'ماركيتنج', title: 'مشروع ختام الماركيتنج: خطة صفحة واحدة', explain: 'اجمع كل ما تعلمته في ورقة واحدة: من هو العميل؟ ما عرض القيمة؟ ما قناتان أساسيتان للوصول إليه؟ وما أهم 3 مؤشرات ستقيس بها النجاح شهريًا؟', drill: 'اكتب خطة تسويق من 5 نقاط لمشروعك أو خدمتك.', ytTitle: 'تعلم التسويق الإلكتروني في ساعة', ytUrl: 'https://www.youtube.com/watch?v=4ricNvHHL5o' },

      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'كيف تفكر نماذج الذكاء الاصطناعي (LLMs)؟', explain: 'الذكاء الاصطناعي التوليدي ليس محرك بحث جامد، بل نموذج لغوي يتوقع الكلمات بناءً على السياق. كلما أعطيته سياقًا وهدفًا أوضح، تحولت إجابته من عامة إلى احترافية.', drill: 'جرّب سؤالًا عامًا ثم أعد كتابته بسياق محدد وقارن النتيجتين.', ytTitle: 'النماذج الكبرى وهندسة الأوامر', ytUrl: 'https://www.youtube.com/watch?v=cJZGYNFw9RI' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'قاعدة البرومبت الاحترافي (Role-Context-Task-Format)', explain: 'لبناء أمر قوي حدد 4 عناصر: 1) الدور (أنت خبير...)، 2) السياق (أنا أعمل في...)، 3) المهمة المحددة، 4) شكل المخرج (جدول، 5 نقاط، إيميل رسمي).', drill: 'اكتب برومبت من 4 أجزاء لتنظيم جدول أسبوعك العملي والروحي.', ytTitle: 'أساسيات هندسة أوامر الذكاء الاصطناعي – وليد طه', ytUrl: 'https://www.youtube.com/watch?v=2_3WuekEg4s' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'التوجيه بالأمثلة (Few-Shot Prompting)', explain: 'بدل شرح الأسلوب طويلًا، أعطِ النموذج مثالين من كتابتك السابقة واطلب منه إنتاج النص الجديد بنفس النبرة والطول والتنسيق.', drill: 'أعطِ الـ AI فقرة من كتابتك واطلب منه صياغة إيميل جديد بنفس الأسلوب.', ytTitle: 'كورس Prompt Engineering في أقل من 30 دقيقة', ytUrl: 'https://www.youtube.com/watch?v=1Grt4-ln-1Q' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'التفكير خطوة بخطوة (Chain-of-Thought)', explain: 'إضافة عبارة «فكّر خطوة بخطوة واشرح المعايير قبل القرار النهائي» ترفع دقة التحليل المنطقي والقرارات العملية بشكل كبير.', drill: 'استخدمه للمقارنة بين خيارين عمليين بناءً على 4 معايير.', ytTitle: 'تعلم مهارة كتابة الأوامر للذكاء الاصطناعي', ytUrl: 'https://www.youtube.com/watch?v=Q1Sh00SGdvI' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'تلخيص المستندات والاجتماعات بذكاء', explain: 'اطلب منه دائمًا تقسيم الملخص إلى: (أهم 3 قرارات + قائمة المهام Action Items + المسؤول والموعد النهائي) بدل فقرة طويلة مملة.', drill: 'لخّص مقالًا أو محضر اجتماع طويل في 5 نقاط تنفيذية.', ytTitle: 'هندسة الأوامر لمضاعفة إنتاجيتك', ytUrl: 'https://www.youtube.com/watch?v=HNVJHTeLIjg' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'صياغة وتحسين الإيميلات العملية بالـ AI', explain: 'يمكنك كتابة أفكارك بالعامية وطلب تحويلها لإيميل رسمي أو ودي بالعربية أو الإنجليزية مع خيارين: مختصر وتفصيلي.', drill: 'حوّل 3 ملاحظات سريعة إلى إيميل متابعة منظم.', ytTitle: 'كتابة البرومبت لزيادة الإنتاجية', ytUrl: 'https://www.youtube.com/watch?v=SEwkCSWUoD8' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'الذكاء الاصطناعي مع Excel وجداول البيانات', explain: 'صف للـ AI أسماء الأعمدة والنتيجة المطلوبة، وسيكتب لك معادلات XLOOKUP وSUMIFS وIF المتداخلة فورًا مع شرح كل جزء.', drill: 'اطلب معادلة Excel تحسب نسبة الإنجاز وتصنّف الحالة إلى «مكتمل / متأخر».', ytTitle: 'كورس هندسة التلقين MasterClass', ytUrl: 'https://www.youtube.com/watch?v=gZv5hFW3OF8' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'هيكلة العروض التقديمية والـ Slides', explain: 'اطلب منه أولًا «هيكل شرائح (Outline) بعناوين قوية و3 نقاط مختصرة لكل شريحة + اقتراح رسم بياني» قبل فتح PowerPoint.', drill: 'اطلب هيكل عرض من 6 شرائح يشرح مشروعًا أو إنجازًا لك.', ytTitle: 'هندسة الأوامر للنتائج الاحترافية', ytUrl: 'https://www.youtube.com/watch?v=HNVJHTeLIjg' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'التحقق من الهلوسة (Fact-Checking)', explain: 'نماذج الـ AI قد تؤلّف أرقامًا أو مراجع تبدو مقنعة لكنها غير صحيحة. القاعدة العملية: استعن به في الصياغة والتنظيم، وتحقق دائمًا من المصادر الرسمية.', drill: 'راجع معلومة أو رقمًا من الـ AI وتأكد من مصدره الأصلي.', ytTitle: 'تحسين البرومبت بالتكرار Iteration', ytUrl: 'https://www.youtube.com/watch?v=YHAxLelTr0k' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'توليد أفكار التسويق والمحتوى بالـ AI', explain: 'اربط ما تعلمته في كورس الماركيتنج بالـ AI: أعطه الـ Persona واطلب 5 Hooks وإعلانات بنموذج AIDA وPAS للاختبار.', drill: 'اطلب 5 أفكار محتوى لجمهور محدد مع CTA مناسب لكل فكرة.', ytTitle: 'أساسيات هندسة الأوامر – وليد طه', ytUrl: 'https://www.youtube.com/watch?v=2_3WuekEg4s' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'أتمتة المهام المتكررة (Apps Script & No-Code)', explain: 'حتى بدون خبرة برمجية عميقة، يمكنك وصف مهمة متكررة في Google Sheets ليولّد لك كود Apps Script يختصر ساعات أسبوعيًا.', drill: 'حدد مهمة متكررة في يومك واسأل الـ AI كيف تختصر وقتها للنصف.', ytTitle: 'كورس Prompt Engineering في أقل من 30 دقيقة', ytUrl: 'https://www.youtube.com/watch?v=1Grt4-ln-1Q' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'الـ AI كمدرب شخصي ومحاكاة مقابلات العمل', explain: 'اطلب منه تقمّص دور مدير توظيف يسألك سؤالًا تلو الآخر ثم يقيّم إجابتك ويقترح نسخة أقوى.', drill: 'أجرِ مقابلة تجريبية من 3 أسئلة واطلب تقييمًا لنقاط التحسين.', ytTitle: 'كتابة البرومبت لزيادة الإنتاجية', ytUrl: 'https://www.youtube.com/watch?v=SEwkCSWUoD8' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'الخصوصية وأمان البيانات مع أدوات الـ AI', explain: 'لا تضع أبدًا كلمات سر، أرقام قومية، بيانات عملاء سرية، أو عقودًا خاصة كما هي؛ استبدل الأسماء والأرقام برموز (Anonymization) أولًا.', drill: 'طبّق قاعدة إخفاء الأسماء الحقيقية قبل تلخيص أي مستند عمل.', ytTitle: 'النماذج الكبرى وهندسة الأوامر', ytUrl: 'https://www.youtube.com/watch?v=cJZGYNFw9RI' },
      { track: 'ai', trackAr: 'ذكاء اصطناعي', title: 'بناء مكتبة برومبتات خاصة بمجالك', explain: 'بدل إعادة كتابة الأوامر كل يوم، احفظ أفضل 5 برومبتات مجرّبة في ملف واحد على Google Docs أو Keep لاستخدامها في ثوانٍ.', drill: 'اجمع 3 قوالب برومبت جاهزة ستستخدمها الأسبوع القادم.', ytTitle: 'تعلم كتابة البرومبت باحتراف', ytUrl: 'https://www.youtube.com/watch?v=YHAxLelTr0k' },

      // Track 3: Practical Business English (Days 30–43)
      { track: 'english', trackAr: 'لغة إنجليزية', title: 'التعريف العملي بالنفس (Elevator Pitch)', explain: 'صيغة واثقة في 30 ثانية: <span class="ltr-text font-semibold">"Hi, I’m [Name]. I work in [Field], focusing on [Skill]. Currently, I’m building my experience in [Goal]."</span> استخدم جملًا قصيرة وواضحة.', drill: 'سجّل لنفسك صوتًا لمدة 30 ثانية تعرّف فيها نفسك بالإنجليزية بصوت مسموع.', ytTitle: 'أهم الكلمات الإنجليزية للأعمال Business English', ytUrl: 'https://www.youtube.com/watch?v=AQ3D_t_ZzSU' },

    const ARABIC_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    function getDateForDay(dayNum) {
      const start = new Date(2026, 10, 25);
      const d = new Date(start.getTime() + (dayNum - 1) * 86400000);
      const dd = d.getDate(), mm = d.getMonth() + 1, yyyy = d.getFullYear();
      return {
        label: `${ARABIC_DAYS[d.getDay()]} ${dd}/${mm}/${yyyy}`,
        short: `${dd}/${mm}`,
        iso: `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`
      };
    }

        return JSON.parse(JSON.stringify(DEFAULT_STATE));

    const DAILY_KEYS = ['reading_ot', 'reel', 'prayer', 'teaching', 'career'];
    const TOTAL_DAILY_TASKS = DAYS_DATA.length * DAILY_KEYS.length; // 172

    function getDayCompletion(dayNum) {
      let c = 0;
      DAILY_KEYS.forEach(k => { if (state.completedTasks[`${dayNum}_${k}`]) c++; });
      return c;
    }

    function getStats() {
      let totalDone = 0, spiritualDone = 0, careerDone = 0, fullDays = 0, activeDays = 0;
      let marketingDone = 0, aiDone = 0, englishDone = 0;
      DAYS_DATA.forEach(d => {
        const c = getDayCompletion(d.day);
        totalDone += c;
        if (c === 4) fullDays++;
        if (c > 0) activeDays++;
        ['reading_ot', 'reel', 'prayer', 'teaching'].forEach(k => { if (state.completedTasks[`${d.day}_${k}`]) spiritualDone++; });
        if (state.completedTasks[`${d.day}_career`]) {
          careerDone++;
          if (d.career.track === 'marketing') marketingDone++;
          if (d.career.track === 'ai') aiDone++;
          if (d.career.track === 'english') englishDone++;
        }
      });

      let quizScore = 0, quizCorrect = 0, quizAnswered = 0;
      COMPETITION_BANK.forEach(q => {
        if (state.quizAnswers[q.id] !== undefined) {
          quizAnswered++;
          if (state.quizAnswers[q.id] === q.ans) {
            quizScore += 10;
            quizCorrect++;
          }
        }
      });

      return {
        totalDone,
        totalPct: Math.round((totalDone / TOTAL_DAILY_TASKS) * 100),
        spiritualPct: Math.round((spiritualDone / (43 * 4)) * 100),
        careerPct: Math.round((careerDone / 43) * 100),
        careerDone, marketingDone, aiDone, englishDone,
        fullDays, activeDays,
        quizScore, quizCorrect, quizAnswered
      };
    }

    async function syncFromSupabase(userObj) {
      if (!sb || !userObj) return;
      try {
        const uid = userObj.id;
        const { data: prof } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
        if (prof) {
          state.user = {
            id: uid,
            email: prof.email || userObj.email || '',
            name: prof.full_name || (userObj.email ? userObj.email.split('@')[0] : 'عضو'),
            meeting: prof.meeting || 'مارمينا خريجين',
            whatsapp: prof.whatsapp || '',
            whatsappOptIn: !!prof.whatsapp_opt_in
          };
          state.jesusPrayers = prof.jesus_prayers || 0;
          await sb.from('profiles').update({ last_active_date: new Date().toISOString().slice(0, 10) }).eq('id', uid);
        } else {
          state.user = {
            id: uid,
            email: userObj.email || '',
            name: userObj.email ? userObj.email.split('@')[0] : 'عضو',
            meeting: state.user.meeting || 'مارمينا خريجين',
            whatsapp: state.user.whatsapp || '',
            whatsappOptIn: true
          };
        }
        state.role = 'user';
        state.adminMeeting = null;
        const { data: roleRow } = await sb.from('user_roles').select('role,admin_meeting').eq('user_id', uid).maybeSingle();
        if (roleRow && roleRow.role) {
          state.role = roleRow.role === 'servant_admin' ? 'admin' : roleRow.role;
          state.adminMeeting = roleRow.admin_meeting || (state.user && state.user.meeting) || null;
        }
        const { data: progRows } = await sb.from('user_progress').select('day_num,task_key').eq('user_id', uid);
        if (Array.isArray(progRows)) {
          state.completedTasks = {};
          progRows.forEach(r => { state.completedTasks[`${r.day_num}_${r.task_key}`] = true; });
        }
        const { data: attRows } = await sb.from('attendance_logs').select('log_date,checks,notes').eq('user_id', uid);
        if (Array.isArray(attRows)) {
          state.attendance = {};
          attRows.forEach(a => { state.attendance[a.log_date] = { checks: a.checks || {}, notes: a.notes || {} }; });
        }
        const { data: qRows } = await sb.from('quiz_answers').select('question_id,selected_option').eq('user_id', uid);
        if (Array.isArray(qRows)) {
          state.quizAnswers = {};
          qRows.forEach(r => { state.quizAnswers[r.question_id] = r.selected_option; });
        }
        const { data: notifs } = await sb.from('user_notifications').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(20);
        if (Array.isArray(notifs)) userNotificationsCache = notifs;
        const { data: cfg } = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle();
        if (cfg) {
          state.announcement = cfg.announcement || '';
          state.quizOpen = !!cfg.quiz_open;
          state.lockFutureDays = !!cfg.lock_future_days;
          state.whatsappConfig.checkTime = cfg.wa_check_time || '20:00';
          state.whatsappConfig.template = cfg.wa_template || state.whatsappConfig.template;
        }
        const { data: lb } = await sb.rpc('get_live_leaderboard');
        if (Array.isArray(lb)) liveLeaderboardCache = lb;

        if (state.role === 'admin' || state.role === 'super_admin') {
          const { data: mStats } = await sb.rpc('get_admin_meeting_stats');
          const { data: allU } = await sb.rpc('get_all_users_for_admin');
          if (Array.isArray(allU)) liveAllUsersCache = allU;
          if (Array.isArray(mStats)) liveMeetingStatsCache = mStats;
          const { data: em } = await sb.from('emergency_requests').select('*').order('created_at', { ascending: false }).limit(30);
          if (Array.isArray(em)) {
            state.emergencyRequests = em.map(x => ({ id: String(x.id), meeting: x.meeting, type: x.request_type, note: x.note, status: x.status }));
          }
          const { data: wa } = await sb.rpc('get_inactive_whatsapp_users');
          if (Array.isArray(wa)) {
            state.inactiveDemoUsers = wa.map(u => {
              const digits = String(u.whatsapp || '').replace(/[^0-9]/g, '');
              const egyptPhone = digits.startsWith('0') ? '20' + digits.slice(1) : digits;
              return { id: u.user_id, name: u.full_name, meeting: u.meeting, phone: egyptPhone, lastDate: u.last_active_date, sent: false };
            });
          } else {
            state.inactiveDemoUsers = [];
          }
          const { data: logs } = await sb.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(20);
          if (Array.isArray(logs)) {
            state.auditLog = logs.map(l => ({ time: new Date(l.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }), actor: l.actor_email, action: l.action }));
          }
        } else {
          state.emergencyRequests = [];
          state.inactiveDemoUsers = [];
          liveMeetingStatsCache = null;
        }
        state.isLoggedIn = true;
        saveState();
        render();
      } catch (err) {
        showToast('تم الاتصال جزئيًا — تأكد من تشغيل setup_supabase.sql');
      }
    }

    async function handleSupabaseAuth(mode) {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const meeting = document.getElementById('loginMeeting').value;
      const whatsapp = document.getElementById('loginWhatsapp').value.trim();
      const fullName = (document.getElementById('loginName') && document.getElementById('loginName').value.trim()) || email.split('@')[0];

      if (!email || !password) { showToast('اكتب الإيميل والباسورد أولًا'); return; }
      if (mode === 'signup' && (!meeting || !MEETINGS.includes(meeting))) {
        showToast('❌ مرفوض: لازم تختار الاجتماع (مارمينا خريجين / الملاك ميخائيل جامعة / القديس أغسطينوس) عشان تسجل!');
        const ms = document.getElementById('loginMeeting');
        if (ms) ms.focus();
        return;
      }

      if (!sb) {
        state.user = { id: 'local_user', email, name: fullName, meeting, whatsapp, whatsappOptIn: true };
        state.isLoggedIn = true;
        state.activeTab = 'home';
        saveState();
        render();
        showToast(`أهلًا بيك في رحلة صوم الميلاد – ${meeting} ✝️`);
        return;
      }

      try {
        let authRes;
        if (mode === 'signup') {
          authRes = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName, meeting, whatsapp } } });
          if (authRes.error) throw authRes.error;
          if (authRes.data && authRes.data.user) {

    // Check every 30 seconds for configured Morning Verse (default 10:00) & Afternoon Reminder (default 17:00)
    function checkScheduledNotifications() {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
      const now = new Date();
      const todayKey = now.toISOString().slice(0, 10);
      const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const mTime = state.reminderTime || '10:00';
      const aTime = state.afternoonTime || '17:00';
      try {
        if (hhmm === mTime && !localStorage.getItem(`notif_m_${todayKey}_${mTime}`)) {
          localStorage.setItem(`notif_m_${todayKey}_${mTime}`, '1');
          sendDailyNotification('morning');
        }
        if (hhmm === aTime && !localStorage.getItem(`notif_a_${todayKey}_${aTime}`)) {
          localStorage.setItem(`notif_a_${todayKey}_${aTime}`, '1');
          sendDailyNotification('afternoon');
        }
      } catch (e) {}
    }
    setInterval(checkScheduledNotifications, 30000);

      if (!u) return;
      const perms = u.permissions || { whatsapp: true, emergency: true, quiz: true, announcements: true };
      openModal(`إدارة المستخدم: ${u.full_name}`, `
        <div class="text-xs space-y-3">
          <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 space-y-0.5">
            <div class="font-extrabold">${u.full_name}</div>
            <div class="text-[11px] text-slate-500 ltr-text text-right">${u.email}</div>
            <div class="text-[11px] text-slate-500">📱 ${u.whatsapp || 'غير مسجّل'}</div>
          </div>

          <div class="space-y-1">
            <label class="font-extrabold block">نقل إلى اجتماع:</label>
            <select id="muMeeting" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold">
              ${MEETINGS.map(m => `<option value="${m}" ${u.meeting === m ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
          </div>

          <div class="space-y-1">
            <label class="font-extrabold block">الدور / الترقية:</label>
            <select id="muRole" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold">
              <option value="user" ${u.role === 'user' ? 'selected' : ''}>مستخدم عادي (user)</option>
              <option value="servant_admin" ${u.role === 'servant_admin' ? 'selected' : ''}>أدمن خادم (servant_admin)</option>
              <option value="super_admin" ${u.role === 'super_admin' ? 'selected' : ''}>مدير النظام (super_admin)</option>
            </select>
          </div>

          <div class="space-y-1">
            <label class="font-extrabold block">الاجتماع المسؤول عنه كأدمن (لا يرى غيره):</label>
            <select id="muAdminMeeting" class="w-full p-2.5 rounded-xl bg-amber-50/70 dark:bg-slate-800 border border-amber-300 dark:border-slate-700 font-bold">
              ${MEETINGS.map(m => `<option value="${m}" ${(u.admin_meeting || u.meeting) === m ? 'selected' : ''}>أدمن على: ${m}</option>`).join('')}
            </select>
          </div>

          <div class="space-y-1.5 pt-1 border-t border-slate-100 dark:border-slate-800">
            <div class="font-extrabold">تحديد صلاحيات الأدمن التفصيلية:</div>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="muPermWa" ${perms.whatsapp !== false ? 'checked' : ''} class="w-4 h-4 accent-teal-700" /><span>إدارة تنبيهات واتساب الغياب</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="muPermEm" ${perms.emergency !== false ? 'checked' : ''} class="w-4 h-4 accent-teal-700" /><span>متابعة طلبات الطوارئ الروحية</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="muPermQuiz" ${perms.quiz !== false ? 'checked' : ''} class="w-4 h-4 accent-teal-700" /><span>فتح وإغلاق المسابقات</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="muPermAnn" ${perms.announcements !== false ? 'checked' : ''} class="w-4 h-4 accent-teal-700" /><span>نشر التنبيهات العامة</span></label>
          </div>

          <button type="button" id="btnSaveManageUser" data-mu-uid="${u.user_id}" class="w-full py-2.5 rounded-xl hero-gradient text-white font-extrabold">حفظ الصلاحيات والاجتماع ✓</button>

          <div class="pt-3 border-t border-slate-200 dark:border-slate-700 space-y-2">
            <div class="font-extrabold text-rose-700 dark:text-rose-300">🔑 تغيير باسورد المستخدم (إذا نسيه):</div>
            <div class="flex gap-1.5">
              <div class="relative flex-1">
                <input id="muNewPass" type="password" placeholder="باسورد جديد (6 حروف+)" class="w-full p-2 pl-8 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs" />
                <button type="button" data-toggle-pw="muNewPass" class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500"><i data-lucide="eye" class="w-3.5 h-3.5"></i></button>
              </div>
              <button type="button" id="btnAdminResetPw" data-pw-uid="${u.user_id}" class="px-3 py-2 rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-extrabold shrink-0">تغيير الباسورد</button>
            </div>
          </div>
        </div>
      `);
    }

    document.addEventListener('click', async (e) => {
      const mBtn = e.target.closest('[data-manage-uid]');
      if (mBtn) { openManageUserModal(mBtn.dataset.manageUid); return; }

      const saveMu = e.target.closest('#btnSaveManageUser');
      if (saveMu && sb) {
        const uid = saveMu.dataset.muUid;
        const newMeeting = document.getElementById('muMeeting').value;
        const newRole = document.getElementById('muRole').value;
        const newPerms = {
          whatsapp: !!document.getElementById('muPermWa').checked,
          emergency: !!document.getElementById('muPermEm').checked,
          quiz: !!document.getElementById('muPermQuiz').checked,
          announcements: !!document.getElementById('muPermAnn').checked
        };
        const newAdminMeeting = document.getElementById('muAdminMeeting') ? document.getElementById('muAdminMeeting').value : newMeeting;
        const { error } = await sb.rpc('admin_update_user', {
          target_user_id: uid,
          new_meeting: newMeeting,
          new_role: newRole,
          new_permissions: newPerms,
          new_admin_meeting: newAdminMeeting
        });
        if (error) {
          showToast(`خطأ: ${error.message} — تأكد من تشغيل update_admin_panel_v2.sql`);
        } else {
          const { data: allU } = await sb.rpc('get_all_users_for_admin');
          if (Array.isArray(allU)) liveAllUsersCache = allU;
          closeModal();
          render();
          showToast('تم حفظ الصلاحيات ونقل الاجتماع بنجاح ✓');
        }
      }
    });


    document.addEventListener('click', (e) => {
      if (e.target.closest('#btnQuizPrevDay') && (state.quizDay || 1) > 1) {
        state.quizDay = (state.quizDay || 1) - 1;
        saveState(); render(); return;
      }
      if (e.target.closest('#btnQuizNextDay') && (state.quizDay || 1) < 43) {
        state.quizDay = (state.quizDay || 1) + 1;
        saveState(); render(); return;
      }
      const qd = e.target.closest('[data-quiz-day]');
      if (qd) {
        state.quizDay = Number(qd.dataset.quizDay);
        saveState(); render(); return;
      }
    });


    // In-App Notifications Modal + Live 30s Background Sync for Announcements & Role Promotions
    async function openInAppNotificationsModal() {
      if (sb && state.user.id) {
        const { data: notifs } = await sb.from('user_notifications').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false }).limit(20);
        if (Array.isArray(notifs)) userNotificationsCache = notifs;
      }
      openModal('الإشعارات والرسائل الداخلية 🔔', `
        ${state.announcement ? `
          <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-xs">
            <div class="font-extrabold text-amber-900 dark:text-amber-200 mb-0.5">📢 تنبيه عام من الإدارة:</div>
            <div>${state.announcement}</div>
          </div>
        ` : ''}
        <div class="space-y-2 max-h-72 overflow-y-auto">
          ${userNotificationsCache.length === 0
            ? '<p class="text-xs text-center text-slate-500 py-4">لا توجد إشعارات شخصية جديدة حاليًا.</p>'
            : userNotificationsCache.map(n => `
              <div class="p-3 rounded-xl border text-xs ${n.is_read ? 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700' : 'bg-teal-50 dark:bg-teal-950/40 border-teal-300 dark:border-teal-700'}">
                <div class="font-extrabold text-nativity-900 dark:text-white">${n.title}</div>
                <div class="text-slate-700 dark:text-slate-200 mt-0.5">${n.body}</div>
              </div>
            `).join('')}
        </div>
      `);
      if (sb && state.user.id && userNotificationsCache.some(n => !n.is_read)) {
        await sb.from('user_notifications').update({ is_read: true }).eq('user_id', state.user.id).eq('is_read', false);
        userNotificationsCache = userNotificationsCache.map(n => ({ ...n, is_read: true }));
        render();
      }
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('#btnInAppNotifs')) { openInAppNotificationsModal(); }
    });

    // Auto-refresh announcements, role changes, and personal notifications every 30s
    setInterval(async () => {
      if (!sb || !state.isLoggedIn || !state.user.id) return;
      try {
        const { data: cfg } = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle();
        let changed = false;
        if (cfg && cfg.announcement !== state.announcement) {
          state.announcement = cfg.announcement || '';
          state.quizOpen = !!cfg.quiz_open;
          state.lockFutureDays = !!cfg.lock_future_days;
          changed = true;
        }
        const { data: notifs } = await sb.from('user_notifications').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false }).limit(20);
        if (Array.isArray(notifs) && notifs.length !== userNotificationsCache.length) {
          userNotificationsCache = notifs;
          const newest = notifs[0];
          if (newest && !newest.is_read) showToast(`🔔 ${newest.title}: ${newest.body}`);
          changed = true;
        }
        const { data: roleRow } = await sb.from('user_roles').select('role,admin_meeting').eq('user_id', state.user.id).maybeSingle();
        if (roleRow) {
          const mapped = roleRow.role === 'servant_admin' ? 'admin' : roleRow.role;
          if (mapped !== state.role) {
            state.role = mapped;
            state.adminMeeting = roleRow.admin_meeting || state.user.meeting;
            changed = true;
          }
        }
        if (changed) { saveState(); render(); }
      } catch (e) {}
    }, 30000);


    document.addEventListener('click', async (e) => {
      const eyeBtn = e.target.closest('[data-toggle-pw]');
      if (eyeBtn) {
        const inp = document.getElementById(eyeBtn.dataset.togglePw);
        if (inp) {
          inp.type = inp.type === 'password' ? 'text' : 'password';
          const icon = eyeBtn.querySelector('i');
          if (icon) {
            icon.setAttribute('data-lucide', inp.type === 'text' ? 'eye-off' : 'eye');
            lucide.createIcons();
          }
        }
        return;
      }

      const resetPwBtn = e.target.closest('#btnAdminResetPw');
      if (resetPwBtn && sb) {
        const uid = resetPwBtn.dataset.pwUid;
        const newPw = (document.getElementById('muNewPass') && document.getElementById('muNewPass').value) || '';
        if (newPw.length < 6) { showToast('اكتب باسورد من 6 حروف أو أرقام على الأقل'); return; }
        const { error } = await sb.rpc('admin_reset_user_password', { target_user_id: uid, new_password: newPw });
        if (error) showToast(`خطأ: ${error.message}`);
        else { showToast('تم تغيير باسورد المستخدم بنجاح ✓'); document.getElementById('muNewPass').value = ''; }
      }
    });

    render();
  </script>
</body>
</html>
